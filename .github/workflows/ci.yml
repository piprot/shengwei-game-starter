name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 注入房间服务器地址：优先用仓库 Variable VITE_ROOM_SERVER_URL，
      # 未设置时兜底到 render.yaml 中定义的服务名 adaptive-ascent-server。
      # 不注入会导致部署到 GitHub Pages 的公网前端连不上 localhost。
      - name: Inject room server URL
        run: echo "VITE_ROOM_SERVER_URL=${{ vars.VITE_ROOM_SERVER_URL || 'wss://adaptive-ascent-server.onrender.com' }}" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build

      - name: Audit
        run: npm run audit

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-build
          path: dist

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 1) 服务端冒烟：启动 server/index.mjs，验证 register/cloud_save/leaderboard/match
      - name: Server smoke test
        run: npm run test:server

      # 2) 核心逻辑单元测试（node --experimental-strip-types，无浏览器）
      - name: Unit tests
        run: npm run test:unit

      # 3) 端到端冒烟：Playwright + Microsoft Edge 频道
      - name: Install Playwright browser (Microsoft Edge)
        run: npx playwright install --with-deps msedge

      - name: End-to-end smoke test
        run: npm test

  deploy:
    needs: [build, test]
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy-${{ github.ref }}
      # true: a new deploy cancels any stale in-progress deploy job, which marks
      # that deployment inactive and releases the GitHub Pages single-slot lock.
      # Prevents the recurring "stuck in deployment_in_progress -> timeout failure"
      # wedge (see historical root cause 176c67b) when pushes land close together.
      cancel-in-progress: true
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: game-build
          path: dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

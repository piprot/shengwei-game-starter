<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>升维 · 自适应领导力情境游戏</title>
    <meta
      name="description"
      content="升维是一款基于权经九章架构、情境高尔夫方法与 Juricore 学院风视觉的在线领导力情境游戏，训练识人、用人、驭人、谋权、掌权、固权与自我进化能力。"
    />
    <meta name="theme-color" content="#0a1013" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
  </head>
  <body>
    <div id="app-loading" role="status" aria-live="polite">
      <span>升维 · 正在加载</span>
    </div>
    <style>
      #app-loading {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-content: center;
        gap: 14px;
        justify-items: center;
        background: #0a1013;
        color: #e7eef2;
        font-family: system-ui, sans-serif;
        font-size: 15px;
        letter-spacing: 0;
      }
      #app-loading::after {
        content: "";
        width: 28px;
        height: 28px;
        border: 3px solid rgba(242, 193, 78, 0.25);
        border-top-color: #f2c14e;
        border-radius: 50%;
        animation: app-load-spin 0.9s linear infinite;
      }
      @keyframes app-load-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
